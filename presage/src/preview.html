<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SpeakSmart camera preview</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 0; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    #hint { font-size: 1.4rem; min-height: 2.2em; margin: 12px 0; }
    #stats, #metrics { font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Presage camera preview</h1>
    <p>This is the SmartSpectra camera feed. Sit so your face and upper chest are both visible.</p>
    <p id="stats">resolution: waiting · fps: waiting</p>
    <p id="hint">Waiting for the first SDK frame…</p>
    <canvas id="preview" width="1280" height="720"></canvas>
    <p id="metrics">Waiting for metrics…</p>
  </main>
  <script>
    const hint = document.getElementById("hint");
    const metrics = document.getElementById("metrics");
    const stats = document.getElementById("stats");
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");

    const events = new EventSource("/events");
    events.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.hint) hint.textContent = data.hint;
      if (data.metrics) metrics.textContent = data.metrics;
      const resolution = data.resolution || "waiting";
      const fps = data.fps || "waiting";
      stats.textContent = `resolution: ${resolution} · fps: ${fps}`;
    };

    async function refreshPreview() {
      try {
        const response = await fetch("/preview.rgba?t=" + Date.now(), { cache: "no-store" });
        if (response.ok) {
          const width = Number(response.headers.get("X-Width"));
          const height = Number(response.headers.get("X-Height"));
          const bytes = new Uint8ClampedArray(await response.arrayBuffer());
          if (width > 0 && height > 0 && bytes.length >= width * height * 4) {
            if (canvas.width !== width || canvas.height !== height) {
              canvas.width = width;
              canvas.height = height;
              canvas.style.aspectRatio = `${width} / ${height}`;
            }
            ctx.putImageData(new ImageData(bytes, width, height), 0, 0);
          }
        }
      } catch {
        // keep last frame
      }
      setTimeout(refreshPreview, 90);
    }
    refreshPreview();
  </script>
</body>
</html>
